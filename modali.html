<!-- Modale inserimento nuovo ordine -->
<div class="modal fade" id="aggiungi_ordine_modal" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="modal_title_nuovo_ordine">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal_title_nuovo_ordine">Aggiungi ordine</h5>
                <button type="button" class="btn-close chiudi_aggiunta_ordine" aria-label="Chiudi"></button>
            </div>
            <div class="modal-body" id="aggiungi_ordine_modal_body">
                <div class="row g-3">
                    <div class="col-sm-12 col-md-6">
                        <label class="form-label">Data consegna</label>
                        <div class="input-group date">
                            <input type="text" id="data_di_consegna" class="form-control js-datepicker" autocomplete="off">
                            <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                        </div>
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="form-label">Data di ritiro prevista</label>
                        <div class="input-group date">
                            <input type="text" id="data_di_ritiro_prevista" class="form-control js-datepicker" autocomplete="off">
                            <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                        </div>
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="form-label">Cliente</label>
                        <select class="select-select2 select_clienti" id="cliente">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="form-label">Posizione</label>
                        <input type="text" class="form-control" id="posizione">
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <label class="form-label">Prodotto</label>
                        <select class="select-select2 select_prodotti" id="prodotto">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="col-sm-11 col-md-5">
                        <label class="form-label">Quantità</label>
                        <input type="number" min="1" step="1" class="form-control" id="quantita">
                    </div>
                    <div class="col-sm-1 col-md-1 d-flex align-items-end">
                        <button id="aggiungi_prodotto_a_ordine" type="button" class="btn btn-primary">
                            <i class="far fa-plus-square"></i>
                        </button>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descrizione</label>
                        <textarea class="form-control" rows="3" id="descrizione"></textarea>
                    </div>
                </div>
                <div id="add_products" class="row mt-2"></div>
                <div class="alert alert-danger d-none mt-3 mb-0 errore-modale" role="alert"></div>
            </div>
            <div class="modal-footer">
                <div class="loader_modal d-none"></div>
                <button type="button" class="btn btn-secondary chiudi_aggiunta_ordine">Annulla</button>
                <button type="button" class="btn btn-success" id="conferma_aggiunta_ordine">Conferma</button>
            </div>
        </div>
    </div>
</div>

<!-- Modale di conferma eliminazione ordine -->
<div class="modal fade" id="sei_sicuro_modal" tabindex="-1" role="dialog" aria-labelledby="modal_title_elimina_ordine">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal_title_elimina_ordine">Elimina ordine</h5>
                <button type="button" class="btn-close btn-close-white" aria-label="Chiudi" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Sei sicuro di voler eliminare questo ordine? L'operazione non è reversibile.</p>
                <div class="alert alert-danger d-none mt-3 mb-0 errore-modale" role="alert"></div>
            </div>
            <div class="modal-footer">
                <div class="loader_modal_elimina_ordine d-none"></div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button id="conferma_rimuovi_ordine" type="button" class="btn btn-danger">Elimina</button>
            </div>
        </div>
    </div>
</div>
